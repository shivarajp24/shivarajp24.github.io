name: Daily Cybersecurity Content

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate and publish content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SHIVARAJCYBER_BOT: ${{ secrets.SHIVARAJCYBER_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_content.py

      - name: Commit and push
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Daily content"
          git push
